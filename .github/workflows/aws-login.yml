name: AWS Login Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python3 -c \
            'import json, sys; print(json.load(sys.stdin)["value"])')

          export TOKEN

          python3 <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("iss =", claims.get("iss"))
          print("aud =", claims.get("aud"))
          print("sub =", claims.get("sub"))
          print("repository =", claims.get("repository"))
          print("ref =", claims.get("ref"))
          print("environment =", claims.get("environment"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity