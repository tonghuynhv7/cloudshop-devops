name: CloudShop CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  ECR_REPOSITORY: cloudshop-dev-api

  ECS_CLUSTER: cloudshop-dev-cluster
  ECS_SERVICE: cloudshop-dev-api-service

  CONTAINER_NAME: cloudshop-api

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # SOURCE CODE
      # =====================================================

      - name: Checkout source
        uses: actions/checkout@v4

      # =====================================================
      # AWS OIDC
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # ECR LOGIN
      # =====================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =====================================================
      # IMAGE TAG
      # =====================================================

      - name: Set image URI
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # =====================================================
      # BUILD + PUSH
      # =====================================================

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.uri }}" \
            ./backend

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.uri }}"

      # =====================================================
      # GET CURRENT ECS TASK DEFINITION
      # =====================================================

      - name: Download current task definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            > task-definition.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > task-definition-clean.json

      # =====================================================
      # REPLACE IMAGE
      # =====================================================

      - name: Render new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      # =====================================================
      # DEPLOY ECS
      # =====================================================

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true